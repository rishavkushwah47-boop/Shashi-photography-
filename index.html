<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shashi Photography Studio | Wedding & Cinematic Photography</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root{
    --cream:#f7f3eb;
    --cream-dark:#eee8dc;
    --white:#fffdf8;
    --black:#24221f;
    --muted:#77726a;
    --line:#ded7ca;
    --accent:#9a7b4f;
    --accent-light:#c8b28d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:90px;
}

body{
    background:var(--cream);
    color:var(--black);
    font-family:'DM Sans',Arial,sans-serif;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}


/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:9999;
    background:rgba(247,243,235,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
}

.navbar{
    width:92%;
    max-width:1250px;
    min-height:82px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:180px;
    max-height:62px;
    object-fit:contain;
}

.nav{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav a{
    font-size:12px;
    font-weight:600;
    transition:.3s;
}

.nav a:hover{
    color:var(--accent);
}

.book-btn{
    padding:11px 20px;
    background:var(--black);
    color:white !important;
    border-radius:25px;
}

.book-btn:hover{
    background:var(--accent);
}

.menu{
    display:none;
    border:1px solid var(--line);
    background:transparent;
    padding:7px 12px;
    font-size:21px;
    border-radius:7px;
    cursor:pointer;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:calc(100vh - 82px);

    display:flex;
    align-items:center;

    padding:80px 20px;

    background:
    linear-gradient(
        90deg,
        rgba(247,243,235,.97),
        rgba(247,243,235,.84),
        rgba(247,243,235,.25)
    ),
    url("6B1A6378 (6).jpg") center/cover no-repeat;
}

.hero-inner{
    width:92%;
    max-width:1250px;
    margin:auto;
}

.hero-content{
    max-width:680px;
    animation:fadeUp 1s ease both;
}

.label{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:18px;
}

.hero h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(48px,7vw,82px);
    line-height:1.04;
    font-weight:600;
    margin-bottom:25px;
}

.hero h1 span{
    color:var(--accent);
}

.hero p{
    color:var(--muted);
    font-size:17px;
    line-height:1.8;
    max-width:620px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.primary-btn{
    display:inline-block;
    background:var(--black);
    color:#fff;
    padding:14px 27px;
    border-radius:4px;
    font-size:13px;
    font-weight:700;
    transition:.3s;
}

.primary-btn:hover{
    background:#4a4742;
    transform:translateY(-2px);
}

.secondary-btn{
    display:inline-block;
    border:1px solid var(--black);
    color:var(--black);
    padding:13px 25px;
    border-radius:4px;
    font-size:13px;
    font-weight:700;
    transition:.3s;
}

.secondary-btn:hover{
    background:var(--black);
    color:white;
}


/* =====================================================
   COMMON
===================================================== */

section{
    padding:95px 20px;
}

.container{
    width:92%;
    max-width:1150px;
    margin:auto;
}

.section-head{
    margin-bottom:55px;
}

.section-head.center{
    text-align:center;
}

.section-head small{
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:10px;
    font-weight:700;
}

.section-head h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(38px,5vw,55px);
    line-height:1.1;
    margin-top:10px;
}

.section-head h2 span{
    color:var(--accent);
}

.section-head p{
    color:var(--muted);
    max-width:620px;
    line-height:1.7;
    margin-top:14px;
}

.section-head.center p{
    margin-left:auto;
    margin-right:auto;
}


/* =====================================================
   PORTFOLIO
===================================================== */

.portfolio{
    background:var(--cream);
}

.category-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:35px;
}

.category-btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--black);
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    font-size:13px;
    transition:.3s;
}

.category-btn:hover,
.category-btn.active{
    background:var(--black);
    color:white;
    border-color:var(--black);
}

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.photo{
    background:var(--white);
    border:1px solid var(--line);
    overflow:hidden;
}

.photo img{
    width:100%;
    height:430px;
    object-fit:cover;
    transition:.6s ease;
}

.photo:hover img{
    transform:scale(1.035);
}

.photo-info{
    padding:16px 18px;
}

.photo-info h3{
    font-size:16px;
    font-weight:600;
}

.photo-info p{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
}


/* =====================================================
   ABOUT
===================================================== */

.about{
    background:var(--white);
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-image{
    position:relative;
}

.about-image::after{
    content:"";
    position:absolute;
    left:18px;
    top:18px;
    width:100%;
    height:100%;
    border:1px solid var(--line);
    z-index:0;
}

.about-image img{
    position:relative;
    z-index:1;
    width:100%;
    height:560px;
    object-fit:cover;
}

.about-text p{
    color:var(--muted);
    line-height:1.9;
    margin-bottom:18px;
}

.experience{
    display:flex;
    align-items:center;
    gap:15px;
    margin-top:28px;
}

.experience strong{
    font-family:'Playfair Display',serif;
    font-size:52px;
    color:var(--accent);
}

.experience span{
    font-size:13px;
    color:var(--muted);
}


/* =====================================================
   SERVICES
===================================================== */

.services{
    background:var(--cream);
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.service{
    padding:32px 25px;
    background:var(--white);
    border:1px solid var(--line);
    transition:.35s;
}

.service:hover{
    transform:translateY(-6px);
    border-color:var(--accent-light);
    box-shadow:0 15px 35px rgba(36,34,31,.07);
}

.service span{
    color:var(--accent);
    font-size:12px;
    font-weight:700;
}

.service h3{
    font-family:'Playfair Display',serif;
    font-size:25px;
    margin:12px 0;
}

.service p{
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
}


/* =====================================================
   PROCESS
===================================================== */

.process{
    background:var(--white);
}

.process-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    position:relative;
}

.process-card{
    position:relative;
    background:var(--cream);
    border:1px solid var(--line);
    padding:30px 20px;
    text-align:center;
    transition:.35s;
}

.process-card:hover{
    transform:translateY(-7px);
    border-color:var(--accent-light);
    box-shadow:0 15px 30px rgba(36,34,31,.07);
}

.process-number{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--black);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    font-family:'Playfair Display',serif;
    font-size:18px;
    transition:.35s;
}

.process-card:hover .process-number{
    background:var(--accent);
    transform:rotate(8deg) scale(1.08);
}

.process-card h3{
    font-family:'Playfair Display',serif;
    font-size:20px;
    margin-bottom:10px;
}

.process-card p{
    color:var(--muted);
    line-height:1.6;
    font-size:13px;
}


/* =====================================================
   WHY
===================================================== */

.why{
    background:var(--cream-dark);
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.why-card{
    background:var(--white);
    padding:28px;
    border:1px solid var(--line);
    transition:.3s;
}

.why-card:hover{
    transform:translateY(-5px);
}

.why-card h3{
    font-family:'Playfair Display',serif;
    font-size:23px;
    margin-bottom:10px;
}

.why-card p{
    color:var(--muted);
    line-height:1.7;
    font-size:14px;
}


/* =====================================================
   BOOK EVENT
===================================================== */

.book-event{
    background:var(--black);
    color:white;
    text-align:center;
}

.book-event h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(38px,6vw,60px);
}

.book-event p{
    color:#bbb;
    max-width:600px;
    margin:15px auto 28px;
    line-height:1.7;
}

.book-event .primary-btn{
    background:white;
    color:var(--black);
}

.book-event .primary-btn:hover{
    background:var(--accent);
    color:white;
}


/* =====================================================
   ENQUIRY
===================================================== */

.enquiry{
    background:var(--white);
}

.enquiry-box{
    max-width:800px;
    margin:auto;
}

.form{
    display:grid;
    gap:16px;
}

.form input,
.form textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--cream);
    padding:15px 16px;
    border-radius:4px;
    font-family:inherit;
    font-size:14px;
    color:var(--black);
    outline:none;
    transition:.3s;
}

.form input:focus,
.form textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(154,123,79,.08);
}

.form textarea{
    min-height:150px;
    resize:vertical;
}

.form button{
    border:0;
    cursor:pointer;
    width:max-content;
}

.form-status{
    display:none;
    padding:14px 16px;
    background:#e8f6e8;
    color:#34723c;
    border-radius:6px;
    font-size:14px;
    text-align:center;
}

.form-status.show{
    display:block;
}


/* =====================================================
   CONTACT
===================================================== */

.contact{
    background:var(--cream);
}

.contact-layout{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:60px;
    align-items:start;
}

.contact-title h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(45px,6vw,65px);
    line-height:1.05;
    margin:12px 0 18px;
}

.contact-title h2 span{
    color:var(--accent);
}

.contact-title > p{
    color:var(--muted);
    line-height:1.8;
    max-width:600px;
}

.contact-info{
    background:var(--white);
    border:1px solid var(--line);
    padding:25px;
}

.contact-item{
    padding:20px 0;
    border-bottom:1px solid var(--line);
}

.contact-item:first-child{
    padding-top:5px;
}

.contact-item:last-child{
    border-bottom:0;
}

.contact-item small{
    display:block;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:10px;
    font-weight:700;
    margin-bottom:8px;
}

.contact-item a,
.contact-item p{
    color:var(--black);
    font-size:15px;
    line-height:1.7;
    word-break:break-word;
}

.contact-item a:hover{
    color:var(--accent);
}

.contact-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

.contact-action{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 17px;
    border:1px solid var(--line);
    border-radius:25px;
    font-size:13px;
    background:var(--white);
    transition:.3s;
}

.contact-action:hover{
    background:var(--black);
    color:white;
    transform:translateY(-2px);
}


/* =====================================================
   SOCIAL MEDIA
===================================================== */

.social-section{
    background:var(--white);
    text-align:center;
}

.social-section h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(38px,5vw,55px);
    margin-top:10px;
}

.social-section p{
    color:var(--muted);
    margin:14px auto 30px;
    max-width:580px;
    line-height:1.7;
}

.social-grid{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
}

.social-card{
    min-width:170px;
    padding:18px 25px;
    border:1px solid var(--line);
    background:var(--cream);
    border-radius:8px;
    transition:.35s;
    position:relative;
    overflow:hidden;
}

.social-card::before{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:3px;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left;
    transition:.35s;
}

.social-card:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 28px rgba(36,34,31,.08);
}

.social-card:hover::before{
    transform:scaleX(1);
}

.social-icon{
    font-size:22px;
    margin-bottom:7px;
}

.social-card strong{
    display:block;
    font-size:14px;
}

.social-card span{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    background:#1d1b19;
    color:#aaa;
    text-align:center;
    padding:30px 20px;
    font-size:12px;
}

.footer-links{
    display:flex;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.footer-links a{
    color:#ddd;
    transition:.3s;
}

.footer-links a:hover{
    color:var(--accent-light);
}


/* =====================================================
   FLOATING SOCIAL BAR
===================================================== */

.floating-socials{
    position:fixed;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    z-index:8000;

    display:flex;
    flex-direction:column;
    gap:9px;
}

.float-social{
    width:48px;
    height:48px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--black);
    color:white;

    font-size:17px;

    box-shadow:0 8px 25px rgba(0,0,0,.16);

    transition:.35s;

    position:relative;
}

.float-social:hover{
    transform:scale(1.12) translateX(-3px);
    background:var(--accent);
}

.float-social::after{
    content:attr(data-label);

    position:absolute;
    right:58px;
    top:50%;
    transform:translateY(-50%);

    background:var(--black);
    color:white;

    padding:7px 11px;
    border-radius:5px;

    font-size:11px;
    white-space:nowrap;

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.float-social:hover::after{
    opacity:1;
}

.float-social.instagram{
    animation:floatPulse 3s infinite;
}

.float-social.whatsapp{
    animation:floatPulse 3s .7s infinite;
}

.float-social.facebook{
    animation:floatPulse 3s 1.4s infinite;
}

@keyframes floatPulse{
    0%,100%{
        box-shadow:0 8px 25px rgba(0,0,0,.16);
    }
    50%{
        box-shadow:0 8px 30px rgba(154,123,79,.35);
    }
}


/* =====================================================
   SCROLL ANIMATIONS
===================================================== */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.reveal{
    opacity:0;
    transform:translateY(30px);
    transition:opacity .8s ease, transform .8s ease;
}

.reveal.visible{
    opacity:1;
    transform:translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:1000px){

    .process-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .process-card:last-child{
        grid-column:2;
    }

    .contact-layout{
        grid-template-columns:1fr;
    }
}


@media(max-width:850px){

    .navbar{
        min-height:72px;
    }

    .logo{
        width:155px;
    }

    .menu{
        display:block;
    }

    .nav{
        display:none;
        position:absolute;
        top:72px;
        left:0;
        width:100%;
        background:var(--cream);
        border-bottom:1px solid var(--line);
        padding:18px 20px;
        flex-direction:column;
        align-items:stretch;
        gap:5px;
    }

    .nav.show{
        display:flex;
    }

    .nav a{
        padding:12px;
        text-align:center;
    }

    .book-btn{
        text-align:center;
    }

    .hero{
        min-height:78vh;
        padding:60px 15px;
    }

    .hero h1{
        font-size:46px;
    }

    .hero p{
        font-size:15px;
    }

    .about-grid{
        grid-template-columns:1fr;
        gap:45px;
    }

    .about-image img{
        height:450px;
    }

    .service-grid,
    .why-grid{
        grid-template-columns:1fr;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .photo img{
        height:340px;
    }

    .process-grid{
        grid-template-columns:1fr;
    }

    .process-card:last-child{
        grid-column:auto;
    }

    .floating-socials{
        right:10px;
    }

    .float-social{
        width:43px;
        height:43px;
        font-size:15px;
    }

    .float-social::after{
        display:none;
    }
}


@media(max-width:500px){

    section{
        padding:70px 15px;
    }

    .container,
    .navbar,
    .hero-inner{
        width:94%;
    }

    .hero h1{
        font-size:39px;
    }

    .hero{
        background:
        linear-gradient(
            rgba(247,243,235,.9),
            rgba(247,243,235,.75)
        ),
        url("6B1A6378 (6).jpg") center/cover no-repeat;
    }

    .hero-buttons{
        flex-direction:column;
        align-items:stretch;
    }

    .primary-btn,
    .secondary-btn{
        text-align:center;
    }

    .about-image img{
        height:390px;
    }

    .photo img{
        height:300px;
    }

    .category-buttons{
        justify-content:flex-start;
        overflow-x:auto;
        flex-wrap:nowrap;
        padding-bottom:8px;
    }

    .category-btn{
        flex:0 0 auto;
    }

    .contact-info{
        padding:18px;
    }

    .contact-actions{
        flex-direction:column;
    }

    .contact-action{
        justify-content:center;
    }

    .social-card{
        width:100%;
    }

    .floating-socials{
        right:8px;
    }

    .float-social{
        width:40px;
        height:40px;
    }
}
</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="navbar">

<a href="#home">
<img
src="file_00000000df7081faa3dba0a19cc8946c.png"
class="logo"
alt="Shashi Photography Studio">
</a>

<button
class="menu"
onclick="toggleMenu()"
aria-label="Open menu">
☰
</button>

<nav class="nav" id="nav">

<a href="#portfolio">Portfolio</a>

<a href="#about">About</a>

<a href="#services">Services</a>

<a href="#process">Process</a>

<a href="#contact">Contact</a>

<a href="#book" class="book-btn">
Book Event
</a>

</nav>

</div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero" id="home">

<div class="hero-inner">

<div class="her
